
name: Recuperar arquivos da VYRA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto em branch separada
        run: |
          git switch -c "recuperar-vyra-${GITHUB_RUN_NUMBER}"
          mkdir -p recovered-vyra
          unzip -o vyra-1_3.zip -d recovered-vyra

          echo "=== ARQUIVOS ENCONTRADOS ==="
          find recovered-vyra -type f

      - name: Salvar cópia recuperada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add recovered-vyra
          git commit -m "Recuperar arquivos da VYRA"
          git push -u origin HEAD

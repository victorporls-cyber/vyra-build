/* Layout: coluna única de app (máx. 520px), o limite diário em destaque no topo, navegação fixa embaixo. Visual escuro com roxo só onde há ação ou destaque. */
:root {
  --bg: #0a0910;
  --surface: #14121c;
  --surface-2: #1c1927;
  --line: #2b2739;
  --fg: #f6f4fb;
  --muted: #9d98b2;
  --accent: #7c4dff;
  --accent-hi: #b9a2ff;
  --accent-soft: rgba(124, 77, 255, 0.16);
  --danger: #ff7a90;
  --danger-soft: rgba(255, 122, 144, 0.12);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
input { -webkit-user-select: text; user-select: text; }
body.locked { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

.shell { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 132px; }
html.pwa .shell { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }

/* topo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 36px; height: 36px; border-radius: 11px; background: var(--accent); display: grid; place-items: center; flex: none; }

.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.16em; line-height: 1; }
.tagline { font-size: 12px; color: var(--muted); margin-top: 3px; }
.badge-local { position: relative; border: 0; font-family: inherit; font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-hi); background: var(--accent-soft); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.badge-local::after { content: ""; position: absolute; inset: -10px -6px; }
.badge-local.demo { background: var(--accent); color: #fff; }

.screen { display: flex; flex-direction: column; gap: 14px; }
.screen.enter { animation: rise 0.28s ease both; }
.screen-head h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.screen-head p { color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* hero */
.hero {
  position: relative; overflow: hidden; border-radius: 28px; padding: 24px 22px 22px;
  background: radial-gradient(120% 90% at 100% 0%, rgba(124, 77, 255, 0.55) 0%, rgba(124, 77, 255, 0) 60%), linear-gradient(165deg, #241748 0%, #171229 60%, #14121c 100%);
  border: 1px solid rgba(185, 162, 255, 0.28);
  box-shadow: 0 18px 40px -22px rgba(124, 77, 255, 0.7);
}
.eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-hi); font-weight: 600; }
.hero-num { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 14vw, 64px); line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -0.02em; }
.hero-num.long { font-size: clamp(30px, 9vw, 44px); }
.hero-sub { margin-top: 8px; color: #cfc6e8; }
.hero-sub b { color: var(--fg); font-weight: 600; }
.hero.over .hero-num { color: #d9d3ea; }
.alert strong { display: block; font-family: var(--font-display); font-size: 17px; color: #ffd3da; margin-bottom: 2px; }
.alert { margin-top: 16px; background: var(--danger-soft); border: 1px solid rgba(255, 122, 144, 0.35); color: #ffc2cc; border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.hint { margin-top: 16px; background: var(--accent-soft); border: 1px solid rgba(185, 162, 255, 0.3); color: #dcd2ff; border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.hint button { display: block; margin-top: 6px; background: none; border: 0; padding: 0; color: var(--accent-hi); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }

/* botões */
.btn { min-height: 54px; border-radius: 16px; border: 1px solid transparent; padding: 0 20px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.12s ease, background 0.15s ease; text-align: center; }
.btn:active { transform: scale(0.98); }
.btn.block { width: 100%; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 10px 26px -10px rgba(124, 77, 255, 0.85); }
.btn.primary:hover { background: #8a5fff; }
.btn.ghost { background: var(--surface-2); border-color: var(--line); }
.btn.ghost:hover { border-color: #3a3550; }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(255, 122, 144, 0.35); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* nome e meta */
.greet { font-family: var(--font-display); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
.goal-name { margin-top: 6px; font-weight: 600; overflow-wrap: anywhere; }
.goal .track { height: 8px; margin: 12px 0 14px; }
.goal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.goal .btn-row { margin-top: 14px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.card h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { min-width: 0; }
.stat .label { font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.stat .val { font-family: var(--font-display); font-weight: 600; font-size: clamp(17px, 5vw, 21px); margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat.main .val { color: var(--accent-hi); }
.stat.main.neg .val { color: var(--danger); }
.pay { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pay .label { font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.pay .date { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.pay .when { color: var(--muted); font-size: 14px; margin-top: 2px; }
.pay .amount { text-align: right; font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pay .amount small { display: block; font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 12px; }

.sum-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sum-head .total { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.cats { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.cat-row .line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.cat-row .line span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.track { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s ease; }

.calc { display: flex; flex-direction: column; margin-top: 10px; }
.calc .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.calc .row span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.calc .row.sep { border-bottom: 0; }
.calc .row.res { font-weight: 600; }
.calc .row.res span:last-child { color: var(--accent-hi); }
.calc .row.res.neg span:last-child { color: var(--danger); }
.calc .op { color: var(--muted); display: inline-block; width: 18px; }

/* notas */
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border: 1px solid rgba(185, 162, 255, 0.22); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #dcd2ff; }
.note svg { flex: none; margin-top: 2px; }

/* listas */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.item.flash { animation: flash 1.4s ease both; }
.item-main { background: none; border: 0; padding: 0; margin: 0; text-align: left; color: inherit; display: block; min-width: 0; min-height: 44px; cursor: pointer; border-radius: 10px; }
.item-title { display: block; font-weight: 600; overflow-wrap: anywhere; }
.item-meta { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.cmp .line span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

}

<script>
(function () {
  'use strict';

  /* =====================================================================
     VYRA 1.1
     Organização do código (tudo neste arquivo, de baixo nível para cima):
       1. Datas        4. Seletores/cálculo (funções puras: não tocam na tela)
       2. Dinheiro     5. Interface (telas, gavetas, avisos)
       3. Modelo       6. Ações e eventos
     Para crescer (cartão, metas, categorias, histórico, planos) basta:
     novas listas com { id, ... } no modelo (seção 3) + novos seletores (seção 4).
     ===================================================================== */

  var KEY = 'vyra:v1';        // chave mantida de propósito: os dados da V4 são migrados, não perdidos
  var SCHEMA = 2;             // versão do formato dos dados salvos
  var CATS = ['Alimentação', 'Transporte', 'Lazer', 'Compras', 'Saúde', 'Outros'];
  var INCOME_TYPES = { salario: 'Salário', vale: 'Vale' };
  var MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var MAX_CENTS = 9999999999;

  /* ---------- 1. datas locais (sem toISOString, que converte para UTC) ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return toISO(new Date()); }
  function parseISO(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    if (y < 2000 || y > 2100) return null;
    return dt;
  }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function diffDays(aISO, bISO) {
    var a = parseISO(aISO), b = parseISO(bISO);
    var ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / 86400000);
  }
  function fmtDate(iso) { var d = parseISO(iso); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : '—'; }
  function fmtShort(iso) { var d = parseISO(iso); return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) : '—'; }

  // Meses: "AAAA-MM". daysInMonth(ano, mês de 1 a 12) devolve 28, 29, 30 ou 31 (bissexto incluído).
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
  function parseYM(ym) {
    var m = /^(\d{4})-(\d{2})$/.exec(ym || '');
    if (!m) return null;
    var y = +m[1], mo = +m[2];
    if (mo < 1 || mo > 12 || y < 2000 || y > 2100) return null;
    return { y: y, m: mo };
  }
  function ymOf(iso) { return iso.slice(0, 7); }
  function shiftYM(ym, n) { var p = parseYM(ym), t = p.y * 12 + (p.m - 1) + n; return Math.floor(t / 12) + '-' + pad(t % 12 + 1); }
  function monthLabel(ym) { var p = parseYM(ym); return p ? MONTHS[p.m - 1] + ' de ' + p.y : '—'; }
  // Soma meses a uma data sem estourar o dia (31/01 + 1 mês = 28/02 ou 29/02).
  function addMonthsISO(iso, n) {
    var d = parseISO(iso), ym = shiftYM(ymOf(iso), n), p = parseYM(ym);
    if (!p) return iso;
    return ym + '-' + pad(Math.min(d.getDate(), daysInMonth(p.y, p.m)));
  }

  /* ---------- 2. dinheiro em centavos (inteiros, sem erro de ponto flutuante) ---------- */
  function parseMoney(str) {
    if (typeof str !== 'string') return null;
    var s = str.replace(/R\$/gi, '').replace(/\s/g, '');
    if (!s || !/^[\d.,]+$/.test(s)) return null;
    var hasC = s.indexOf(',') > -1, hasD = s.indexOf('.') > -1;
    if (hasC && hasD) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasC) {
      s = s.replace(',', '.');
    } else if (hasD && /^\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');
    }
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    var p = s.split('.');
    var cents = parseInt(p[0], 10) * 100 + (p[1] ? parseInt((p[1] + '0').slice(0, 2), 10) : 0);
    return cents > MAX_CENTS ? Infinity : cents;
  }
  function brl(c) {
    var neg = c < 0; c = Math.abs(c);
    var r = Math.floor(c / 100), f = c % 100;
    var s = String(r).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + 'R$ ' + s + ',' + pad(f);
  }
  function plain(c) { return brl(c).replace('R$ ', ''); }

  /* ---------- 3. modelo de dados e persistência ----------
     state = {
       v: 2, reserve, demo,
       incomes:  [{ id, type: 'salario'|'vale', desc, amount, date }],   recebimentos normais (renda do mês)
       extras:   [{ id, desc, amount, date }],                           ganhos extras
       bills:    [{ id, name, amount, due, paid }],                      contas (data = vencimento)
       expenses: [{ id, desc, amount, cat, date }]                       gastos do dia a dia
     }
     Valores em centavos. Datas em "AAAA-MM-DD" (calendário local). */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function cents(x) { var n = Math.round(Number(x)); return isFinite(n) && n > 0 ? Math.min(n, MAX_CENTS) : 0; }
  function emptyState() { return { v: SCHEMA, name: '', reserve: 0, demo: false, goal: null, incomes: [], extras: [], bills: [], expenses: [] }; }

  // Aceita dados de qualquer versão e devolve sempre um estado válido: todo item sai com id, descrição, valor e data.
  function sanitize(d) {
    var s = emptyState();
    if (!d || typeof d !== 'object') return s;
    var used = {}, today = todayISO();
    function mkId(x) {
      var id = (typeof x === 'string' || typeof x === 'number') && String(x) ? String(x) : '';
      while (!id || used[id]) id = uid();
      used[id] = true;
      return id;
    }
    function text(v, fallback) { var t = typeof v === 'string' ? v.trim().slice(0, 60) : ''; return t || fallback; }
    function dateOr(v, fallback) { return parseISO(v) ? v : fallback; }

    s.reserve = cents(d.reserve); s.demo = !!d.demo;
    s.name = typeof d.name === 'string' ? d.name.trim().slice(0, 30) : '';
    // Meta de economia: { name, target, initial, adds: [{ id, amount, date }] }. "initial" já estava guardado antes
    // (não sai do disponível); cada item de "adds" saiu do disponível quando foi adicionado.
    if (d.goal && typeof d.goal === 'object' && cents(d.goal.target) > 0) {
      s.goal = { name: text(d.goal.name, 'Minha meta'), target: cents(d.goal.target), initial: cents(d.goal.initial), adds: [] };
      if (Array.isArray(d.goal.adds)) d.goal.adds.forEach(function (a) {
        if (a && cents(a.amount) > 0) s.goal.adds.push({ id: mkId(a.id), amount: cents(a.amount), date: dateOr(a.date, today) });
      });
    }

    if (Array.isArray(d.incomes)) {
      d.incomes.forEach(function (i) {
        if (!i || cents(i.amount) <= 0) return;
        var type = INCOME_TYPES[i.type] ? i.type : 'salario';
        s.incomes.push({ id: mkId(i.id), type: type, desc: text(i.desc, INCOME_TYPES[type]), amount: cents(i.amount), date: dateOr(i.date, today) });
      });
    } else if (cents(d.salary) > 0) {
      // Migração da V4 (um salário + "próximo pagamento"). A V4 já tratava o salário como dinheiro em mãos
      // até o próximo pagamento, então: um salário já recebido (hoje) + o próximo salário na data antiga.
      var pd = parseISO(d.payday) ? d.payday : '';
      if (pd && diffDays(today, pd) > 0) {
        s.incomes.push({ id: mkId(), type: 'salario', desc: 'Salário', amount: cents(d.salary), date: today });
        s.incomes.push({ id: mkId(), type: 'salario', desc: 'Salário', amount: cents(d.salary), date: pd });
      } else {
        s.incomes.push({ id: mkId(), type: 'salario', desc: 'Salário', amount: cents(d.salary), date: pd || today });
      }
    }
    if (Array.isArray(d.extras)) d.extras.forEach(function (x) {
      if (x && cents(x.amount) > 0)
        s.extras.push({ id: mkId(x.id), desc: text(x.desc, 'Ganho extra'), amount: cents(x.amount), date: dateOr(x.date, today) });
    });
    if (Array.isArray(d.bills)) d.bills.forEach(function (b) {
      if (b && typeof b.name === 'string' && cents(b.amount) > 0)
        s.bills.push({ id: mkId(b.id), name: text(b.name, 'Conta'), amount: cents(b.amount), due: dateOr(b.due, today), paid: !!b.paid });
    });
    if (Array.isArray(d.expenses)) d.expenses.forEach(function (e) {
      if (e && cents(e.amount) > 0)
        s.expenses.push({ id: mkId(e.id), desc: text(e.desc, 'Gasto'), amount: cents(e.amount), cat: CATS.indexOf(e.cat) > -1 ? e.cat : 'Outros', date: dateOr(e.date, today) });
    });
    return s;
  }
  function load() {
    var raw = null, parsed = null;
    try { raw = localStorage.getItem(KEY); if (raw) parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    var s = sanitize(parsed);
    if (parsed && typeof parsed === 'object' && parsed.v !== SCHEMA) {
      // Formato antigo (V4): guarda uma cópia e já grava no formato novo, para a data da migração não mudar a cada abertura.
      try { localStorage.setItem(KEY + ':backup-v4', raw); } catch (e) {}
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    }
    return s;
  }
  function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  try { window.dispatchEvent(new CustomEvent('vyra:data-saved', { detail: state })); } catch (e) {}
}

  /* ---------- 4. seletores e cálculo (funções puras) ---------- */
  function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i].amount; return t; }
  // Separa o que já entrou (data de hoje ou antes) do que ainda vai entrar.
  function splitByDate(arr, today) {
    var r = 0, f = 0;
    for (var i = 0; i < arr.length; i++) { if (arr[i].date <= today) r += arr[i].amount; else f += arr[i].amount; }
    return { recebido: r, aReceber: f };
  }
  function goalAdded(st) { return st.goal ? sum(st.goal.adds) : 0; }                       // o que foi colocado na meta pelo VYRA
  function goalSaved(st) { return st.goal ? st.goal.initial + goalAdded(st) : 0; }          // total guardado = inicial + adicionado
  function inMonth(arr, key, ym) { return arr.filter(function (x) { return ymOf(x[key]) === ym; }); }
  function byDate(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }

  // Fim do ciclo = próximo recebimento por ordem de data (salário, vale ou ganho extra com data depois de hoje).
  // Sem prioridade por tipo e sem depender da ordem de cadastro. Se não há nenhum recebimento futuro cadastrado,
  // estima um mês depois do último salário (só serve para dividir os dias; esse dinheiro NÃO entra no cálculo).
  function cycleEnd(st, today) {
    var nxt = upcoming(st, today);
    if (nxt.length) return { date: nxt[0].date, estimated: false, ref: nxt[0].type === 'salario' ? 'salario' : 'recebimento' };
    var base = st.incomes.filter(function (i) { return i.type === 'salario'; }), ref = 'salario';
    if (!base.length) { base = st.incomes; ref = 'recebimento'; }
    if (!base.length) return null;
    var last = base.slice().sort(byDate)[base.length - 1].date, d, k = 0;
    do { k++; d = addMonthsISO(last, k); } while (d <= today && k < 1200);
    return { date: d, estimated: true, ref: ref };
  }
  // Próximos recebimentos (normais e extras) que ainda não chegaram, do mais perto para o mais longe.
  function upcoming(st, today) {
    var l = [];
    st.incomes.forEach(function (i) { if (i.date > today) l.push({ kind: 'income', type: i.type, desc: i.desc, amount: i.amount, date: i.date }); });
    st.extras.forEach(function (x) { if (x.date > today) l.push({ kind: 'extra', type: 'extra', desc: x.desc, amount: x.amount, date: x.date }); });
    return l.sort(byDate);
  }

  // Quanto posso gastar hoje?
  //   disponível = (salário e vale já recebidos + ganhos extras já recebidos) − contas − gastos − reserva
  //   por dia    = disponível ÷ dias até o próximo recebimento (o mais perto no calendário)
  // O que tem data futura só entra quando a data chega.
  function compute(st, today) {
    var inc = splitByDate(st.incomes, today), ext = splitByDate(st.extras, today);
    // Contas e gastos são do mês atual (pela data do aparelho). Os de meses anteriores continuam salvos
    // e aparecem na Visão do mês; aqui entram só como "anteriores", para o dinheiro que sobrou (ou faltou)
    // seguir no cálculo, já que o que foi recebido antes continua em caixa.
    var ym = ymOf(today);
    var contas = sum(inMonth(st.bills, 'due', ym)), gastos = sum(inMonth(st.expenses, 'date', ym));
    var anteriores = sum(st.bills.filter(function (b) { return ymOf(b.due) < ym; })) + sum(st.expenses.filter(function (e) { return ymOf(e.date) < ym; }));
    var recebido = inc.recebido + ext.recebido;
    // O dinheiro colocado na meta sai do disponível uma única vez, aqui. O valor inicial já existia fora do VYRA e não entra na conta.
    var meta = goalAdded(st);
    var disp = recebido - contas - gastos - anteriores - meta - st.reserve;
    var cyc = cycleEnd(st, today), dias = cyc ? diffDays(today, cyc.date) : 1;
    var prox = upcoming(st, today);
    return {
      recebidoNormal: inc.recebido, recebidoExtra: ext.recebido, recebido: recebido,
      aReceberNormal: inc.aReceber, aReceberExtra: ext.aReceber, aReceber: inc.aReceber + ext.aReceber,
      contas: contas, gastos: gastos, anteriores: anteriores, meta: meta, reserva: st.reserve,
      disponivel: disp, dias: dias,
      proximoSalario: cyc ? cyc.date : '', estimado: cyc ? cyc.estimated : false, refCiclo: cyc ? cyc.ref : 'salario',
      proximo: prox.length ? prox[0] : null,
      limite: disp > 0 ? Math.floor(disp / dias) : 0,
      excesso: disp < 0 ? -disp : 0,
      needsIncome: st.incomes.length === 0
    };
  }

  // Dados do mês prontos para os gráficos. Só usa o que o usuário cadastrou; dia sem gasto vale 0.
  // O número de dias vem do calendário (28, 29, 30 ou 31).
  function monthData(st, ym, today) {
    var p = parseYM(ym);
    if (!p) return null;
    var n = daysInMonth(p.y, p.m), dias = [], i;
    for (i = 1; i <= n; i++) dias.push({ dia: i, data: ym + '-' + pad(i), gastos: 0, contas: 0, total: 0 });
    st.expenses.forEach(function (e) { if (ymOf(e.date) === ym) dias[+e.date.slice(8, 10) - 1].gastos += e.amount; });
    var pagas = 0, pend = 0;
    st.bills.forEach(function (b) {
      if (ymOf(b.due) !== ym) return;
      dias[+b.due.slice(8, 10) - 1].contas += b.amount;
      if (b.paid) pagas += b.amount; else pend += b.amount;
    });
    var gastoDia = 0, comGasto = 0, maior = null;
    dias.forEach(function (d) {
      d.total = d.gastos + d.contas;
      gastoDia += d.gastos;
      if (d.gastos > 0) { comGasto++; if (!maior || d.gastos > maior.gastos) maior = d; }
    });
    var nor = splitByDate(inMonth(st.incomes, 'date', ym), today), ext = splitByDate(inMonth(st.extras, 'date', ym), today);
    var recebido = nor.recebido + ext.recebido, gastoContas = pagas + pend, gasto = gastoDia + gastoContas;
    return {
      mes: ym, ano: p.y, numero: p.m, rotulo: monthLabel(ym), diasNoMes: n,
      dias: dias,                                              // gráfico 1: [{ dia, data, gastos, contas, total }] do dia 1 ao último
      gastosPorDia: dias.map(function (d) { return d.gastos; }),
      recebidoNormal: nor.recebido, recebidoExtra: ext.recebido, recebido: recebido,   // gráfico 2: recebido
      aReceberNormal: nor.aReceber, aReceberExtra: ext.aReceber, aReceber: nor.aReceber + ext.aReceber,
      gastoDia: gastoDia, gastoContas: gastoContas, contasPagas: pagas, contasPendentes: pend, gasto: gasto,  // gráfico 2: gasto
      reservado: st.reserve, saldo: recebido - gasto,
      diasComGasto: comGasto, maiorDia: maior
    };
  }

  /* ----- Visão do mês ----- */
  function dailyChartSVG(md, today) {
    var n = md.diasNoMes, W = 320, H = 152, top = 16, base = 130, plotH = base - top;
    var max = 0;
    md.dias.forEach(function (d) { if (d.gastos > max) max = d.gastos; });
    var slot = W / n, bw = Math.max(2, slot * 0.66);
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gastos por dia em ' + esc(md.rotulo) + ', do dia 1 ao dia ' + n + '. Total ' + brl(md.gastoDia) + '.">';
    out += '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="var(--line)" stroke-width="1"/>';
    if (max > 0) out += '<text x="0" y="9">' + brl(max) + '</text>';
    md.dias.forEach(function (d, i) {
      var x = i * slot + (slot - bw) / 2, h;
      if (d.gastos > 0) {
        h = Math.max(2, d.gastos / max * plotH);
        out += '<rect x="' + x.toFixed(2) + '" y="' + (base - h).toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="2" fill="' + (d.data === today ? 'var(--accent-hi)' : 'var(--accent)') + '"/>';
      } else {
        out += '<rect x="' + x.toFixed(2) + '" y="' + (base - 1.5) + '" width="' + bw.toFixed(2) + '" height="1.5" fill="var(--line)"/>';   // dia sem gasto = R$ 0
      }
    });
    var marks = [1, 5, 10, 15, 20, 25, n].filter(function (v, i, a) { return a.indexOf(v) === i && !(v === 25 && n - 25 < 3); });
    marks.forEach(function (v) {
      out += '<text x="' + ((v - 0.5) * slot).toFixed(2) + '" y="' + (H - 6) + '" text-anchor="middle">' + v + '</text>';
    });
    md.dias.forEach(function (d, i) {
      out += '<rect x="' + (i * slot).toFixed(2) + '" y="0" width="' + slot.toFixed(2) + '" height="' + base + '" fill="transparent" data-action="chart-day" data-day="' + d.dia + '"/>';
    });
    return out + '</svg>';
  }
  function dayCaption(d) {
    return '<b>' + fmtShort(d.data) + '</b> · gastos ' + brl(d.gastos) + (d.contas ? ' · contas ' + brl(d.contas) : '');
  }

  function compareHTML(md) {
    var max = Math.max(md.recebido, md.gasto, 1);
    function w(v) { return (v / max * 100).toFixed(2) + '%'; }
    return '<div class="cmp">' +
      '<div><div class="line"><span>Recebido</span><span>' + brl(md.recebido) + '</span></div><div class="stack"><i class="seg s1" style="width:' + w(md.recebidoNormal) + '"></i><i class="seg s2" style="width:' + w(md.recebidoExtra) + '"></i></div></div>' +
      '<div><div class="line"><span>Gasto</span><span>' + brl(md.gasto) + '</span></div><div class="stack"><i class="seg s3" style="width:' + w(md.gastoContas) + '"></i><i class="seg s4" style="width:' + w(md.gastoDia) + '"></i></div></div>' +
      '</div>' +
      '<div class="legend"><span><i class="s1"></i>Salário e vale</span><span><i class="s2"></i>Ganhos extras</span><span><i class="s3"></i>Contas</span><span><i class="s4"></i>Dia a dia</span></div>' +
      '<div class="balance' + (md.saldo < 0 ? ' neg' : '') + '"><span>Saldo do mês</span><span>' + brl(md.saldo) + '</span></div>';
  }

  function monthHTML() {

    var nav = '<div class="month-nav"><button class="icon-btn" type="button" data-action="month-prev" aria-label="Mês anterior"' + (canPrev ? '' : ' disabled') + '>' + I.prev + '</button>' +

        '<div class="stat"><p class="label">Total gasto</p><p class="val">' + brl(md.gasto) + '</p><p class="sub">contas ' + brl(md.gastoContas) + '</p></div>' +

        '<div class="stat"><p class="label">Ganhos extras</p><p class="val">' + brl(md.recebidoExtra) + '</p></div>' +
      '</div>' + aRec +
      '<div class="card"><div class="card-head"><h2>Como estão meus gastos neste mês?</h2></div>' +
        '<p class="card-sub">Gastos do dia a dia, por dia. Dias sem gasto mostram R$ 0.</p>' + dailyChartSVG(md, t) +
        '<p class="chart-cap" id="dayInfo" aria-live="polite">' + cap + '</p></div>' +
      '<div class="card"><div class="card-head"><h2>Ganhos x gastos</h2></div>' +
        '<p class="card-sub">O que entrou e o que saiu em ' + esc(md.rotulo) + '.</p>' + compareHTML(md) + '</div>';
  }

  /* ----- render ----- */
  function render() {
    var html = ui.tab === 'expenses' ? expensesHTML() : ui.tab === 'bills' ? billsHTML() : ui.tab === 'extras' ? extrasHTML() : ui.tab === 'month' ? monthHTML() : ui.tab === 'settings' ? settingsHTML() : homeHTML();
    var el = $('#screen');
    el.innerHTML = '<div class="screen' + (ui.enter ? ' enter' : '') + '">' + html + '</div>';
    ui.enter = false;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].getAttribute('data-tab') === ui.tab) tabs[i].setAttribute('aria-current', 'page'); else tabs[i].removeAttribute('aria-current');
    }
    var bd = $('#badge');
    if (bd) { bd.textContent = state.demo ? 'Exemplo' : 'MVP local'; bd.classList.toggle('demo', !!state.demo); }
    var hn = $('#heroNum');
    if (hn) animateNumber(hn, +hn.getAttribute('data-value'));
    else ui.lastLimit = null;
    ui.flash = null;
  }
  function animateNumber(el, to) {
    var from = ui.lastLimit;
    ui.lastLimit = to;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (from === null || from === to || reduce) return;
    var start = null, dur = 450;
    function step(t) {
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = brl(Math.round(from + (to - from) * e));
      if (p < 1) requestAnimationFrame(step); else el.textContent = brl(to);
    }
    requestAnimationFrame(step);
  }
  function go(tab) {
    if (tab === 'month' && ui.tab !== 'month') ui.month = ymOf(todayISO());
    ui.tab = tab; ui.enter = true; render(); window.scrollTo(0, 0);
  }

  /* ----- gaveta e avisos ----- */

    var f = focusSel ? $(focusSel) : null;
    // Foca o primeiro campo, a menos que o usuário já tenha tocado em outro campo da gaveta.
    if (f) setTimeout(function () { if (!$('#sheet').contains(document.activeElement)) f.focus(); }, 30);
  }
  function closeSheet() {
    $('#backdrop').hidden = true;
    $('#sheet').innerHTML = '';
    document.body.classList.remove('locked');
    if (ui.opener && ui.opener.focus && document.contains(ui.opener)) ui.opener.focus();
    ui.opener = null;
  }

  }

  function hasData() { return state.reserve > 0 || state.incomes.length > 0 || state.extras.length > 0 || state.bills.length > 0 || state.expenses.length > 0 || !!state.goal; }
  function loadDemo() { var nm = state.name; state = sanitize(demoData()); state.name = nm; state.demo = true; save(); ui.lastLimit = null; closeSheet(); ui.tab = 'home'; render(); window.scrollTo(0, 0); toast('Exemplo carregado'); }

  /* ---------- eventos ---------- */

    var b = ev.target.closest('[data-action]');

    var id = b.getAttribute('data-id');
    switch (b.getAttribute('data-action')) {

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('#backdrop').hidden) closeSheet(); });

  /* ---------- teclado e abertura ---------- */
  var TEXTY = 'input[type="text"],input[type="date"]';

    setTimeout(function () {
      sp.classList.add('out');

    }, reduce ? 300 : 700);
  } else askName();
  if (window.VYRA_PWA && /[?&]acao=gasto/.test(location.search)) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    expenseSheet();
  }
})();

          }
        }
      } else if(remote && !local){
        localStorage.setItem("vyra:v1:backup-before-cloud", JSON.stringify(local));
        localStorage.setItem("vyra:v1",JSON.stringify(remote));
        location.reload();
        return;
      } else {
        await upload(user,local || (window.VYRA ? window.VYRA.getState() : {}));
      }
      hide();
      say("");
    } catch(e){
      show();
      say("Erro na sincronização: " + (e.message || "verifique sua conexão."));
    } finally { busy = false; }
  }

  async function start(){
    const {data,error} = await client.auth.getSession();
    if(error){ say(error.message); return; }
    if(data.session) await sync(data.session.user);
    else show();
  }

  document.getElementById("vyra-login").onclick = async function(){
    say("Entrando...");
    const {data,error} = await client.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
    if(error) say(error.message);
    else await sync(data.user);
  };

  document.getElementById("vyra-signup").onclick = async function(){
    say("Criando sua conta...");
    const {data,error} = await client.auth.signUp({email:email.value.trim(),password:pass.value});
    if(error) say(error.message);
    else if(data.session) await sync(data.user);
    else say("Conta criada! Confirme seu e-mail e depois entre na VYRA.");
  };

  document.getElementById("vyra-reset").onclick = async function(){
    if(!email.value.trim()){ say("Digite seu e-mail primeiro."); return; }
    const {error} = await client.auth.resetPasswordForEmail(email.value.trim());
    say(error ? error.message : "Se o e-mail estiver cadastrado, você receberá o link de recuperação.");
  };

  window.addEventListener("vyra:data-saved",function(){
    clearTimeout(timer);
    timer = setTimeout(async function(){
      const {data} = await client.auth.getSession();
      if(data.session){
        try { await upload(data.session.user, localData()); }
        catch(e){ console.warn("VYRA: sincronização pendente",e); }
      }
    },1200);
  });

  window.addEventListener("online",async function(){
    const {data} = await client.auth.getSession();
    if(data.session){
      try { await upload(data.session.user,localData()); }
      catch(e){ console.warn("VYRA: sincronização pendente",e); }
    }
  });

  async function init(){
    if(!window.supabase){ say("Não foi possível carregar o serviço. Verifique sua conexão."); return; }
    client = window.supabase.createClient(URL,KEY);
    client.auth.onAuthStateChange(function(event,session){
      if(event === "SIGNED_OUT") show();
    });
    await start();
  }
  init();
})();
</script>

</body>
</html>
